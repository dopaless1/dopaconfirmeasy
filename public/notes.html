<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" href="/favicon.ico">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DopaConfirm — الملاحظات</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .nav-item.active::before { right:-12px;left:auto;border-radius:4px 0 0 4px; }
    .toast-container { right:auto;left:24px; }

    /* Layout */
    .notes-layout { display:flex;height:calc(100vh - 64px);overflow:hidden; }
    .notes-tree { width:260px;flex-shrink:0;border-left:1px solid var(--border);background:var(--bg-surface);display:flex;flex-direction:column;overflow:hidden; }
    .notes-main { flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0; }

    /* Tree */
    .tree-hd { padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px; }
    .tree-scroll { flex:1;overflow-y:auto;padding:4px 0; }
    .tree-row { display:flex;align-items:center;padding:5px 10px;cursor:pointer;font-size:13px;user-select:none;border-radius:0;transition:background .1s;position:relative; }
    .tree-row:hover { background:var(--primary-light); }
    .tree-row.active { background:var(--primary-light);color:var(--primary-color);font-weight:600; }
    .tree-row.active::before { content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--primary-color); }
    .tree-row .label { flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .tree-row .acts { display:none;gap:2px; }
    .tree-row:hover .acts { display:flex; }
    .act { background:none;border:none;cursor:pointer;padding:2px 5px;font-size:11px;opacity:.6;border-radius:4px; }
    .act:hover { opacity:1;background:rgba(0,0,0,.08); }

    /* Editor header */
    .ed-hd { padding:12px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0; }
    .ed-title { flex:1;font-size:20px;font-weight:700;border:none;background:transparent;color:var(--text-primary);font-family:'Cairo',sans-serif;outline:none; }
    .ed-title::placeholder { color:var(--text-muted); }
    #save-ind { font-size:12px;color:var(--text-muted); }

    /* Floating toolbar — appears on text selection */
    #sel-toolbar {
      display:none;position:fixed;z-index:9999;
      background:#1a1a2e;border-radius:8px;padding:5px 8px;
      gap:3px;align-items:center;flex-wrap:nowrap;
      box-shadow:0 4px 20px rgba(0,0,0,.3);
    }
    #sel-toolbar.show { display:flex; }
    .sel-btn {
      color:#fff;background:none;border:none;cursor:pointer;
      padding:4px 7px;border-radius:5px;font-size:13px;
      transition:background .1s;white-space:nowrap;
    }
    .sel-btn:hover { background:rgba(255,255,255,.15); }
    .sel-div { width:1px;background:rgba(255,255,255,.2);height:16px;margin:0 3px; }
    .clr-dot { width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.3);transition:transform .1s; }
    .clr-dot:hover { transform:scale(1.2); }

    /* Fixed formatting toolbar */
    .fmt-bar { padding:6px 24px;border-bottom:1px solid var(--border);display:flex;gap:3px;flex-wrap:wrap;background:var(--bg-base);flex-shrink:0; }
    .fmt-btn { padding:4px 9px;border:1px solid var(--border);border-radius:5px;background:var(--bg-surface);cursor:pointer;font-size:12px;transition:all .1s;line-height:1.4; }
    .fmt-btn:hover { background:var(--primary-light);border-color:var(--primary-color); }
    .fmt-div { width:1px;background:var(--border);margin:0 3px; }

    /* Editor */
    .ed-body { flex:1;overflow-y:auto;padding:24px 32px; }
    #editor {
      min-height:500px;outline:none;font-size:15px;line-height:1.9;
      font-family:'Cairo',sans-serif;color:var(--text-primary);
      max-width:860px;margin:0 auto;
    }
    #editor:empty::before { content:attr(placeholder);color:var(--text-muted);pointer-events:none; }
    #editor h1 { font-size:26px;margin:20px 0 8px;font-weight:800; }
    #editor h2 { font-size:20px;margin:16px 0 6px;font-weight:700; }
    #editor h3 { font-size:16px;margin:12px 0 4px;font-weight:700; }
    #editor blockquote { border-right:4px solid var(--primary-color);margin:10px 0;padding:6px 16px;background:var(--primary-light);border-radius:0 8px 8px 0;color:var(--primary-color); }
    #editor ul,#editor ol { padding-right:24px;margin:8px 0; }
    #editor a { color:var(--primary-color); }
    #editor code { background:var(--bg-base);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:13px; }
    #editor hr { border:none;border-top:2px solid var(--border);margin:20px 0; }

    /* Resizable images */
    .img-wrap {
      display:inline-block;position:relative;max-width:100%;
      margin:8px 4px;vertical-align:top;
    }
    .img-wrap img { display:block;width:100%;height:auto;border-radius:6px;cursor:default; }
    .img-wrap.selected img { box-shadow:0 0 0 3px var(--primary-color); }

    /* Image floating toolbar */
    .img-ftb {
      display:none;position:absolute;top:-40px;right:0;
      background:#1a1a2e;border-radius:8px;padding:4px 8px;
      gap:4px;align-items:center;white-space:nowrap;z-index:100;
      box-shadow:0 4px 16px rgba(0,0,0,.3);
    }
    .img-wrap.selected .img-ftb { display:flex; }
    .img-ftb button { color:#fff;background:none;border:none;cursor:pointer;padding:3px 7px;border-radius:4px;font-size:12px; }
    .img-ftb button:hover { background:rgba(255,255,255,.15); }

    /* Resize handle */
    .resize-handle {
      position:absolute;bottom:2px;left:2px;
      width:14px;height:14px;background:var(--primary-color);
      border-radius:3px;cursor:nwse-resize;opacity:0;transition:opacity .2s;
      z-index:10;
    }
    .img-wrap.selected .resize-handle { opacity:1; }

    /* Empty state */
    .empty-st { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);gap:10px; }

    /* Move modal */
    .mv-item { padding:9px 14px;cursor:pointer;border-radius:7px;font-size:13px;transition:background .1s; }
    .mv-item:hover { background:var(--primary-light);color:var(--primary-color); }
  </style>
</head>
<body>
<div class="app-layout" id="main-app" style="display:flex">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <a href="/" class="logo-mark">
        <div class="logo-icon">📦</div>
        <div class="logo-text"><span class="logo-name">DopaConfirm</span><span class="logo-sub">نظام تأكيد الطلبات</span></div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">القائمة الرئيسية</div>
      <a href="/" class="nav-item"><span class="nav-icon">📋</span><span>الطلبات</span></a>
      <a href="/settings" class="nav-item"><span class="nav-icon">⚙️</span><span>الإعدادات</span></a>
      <a href="/workspace" class="nav-item"><span class="nav-icon">🗂️</span><span>مساحة العمل</span></a>
      <a href="/notes" class="nav-item active"><span class="nav-icon">📝</span><span>الملاحظات</span></a>
      <div class="nav-section-title" style="margin-top:16px">أدوات</div>
      <a href="/health" class="nav-item" target="_blank"><span class="nav-icon">❤️</span><span>فحص الخادم</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="server-status">
        <div class="status-dot" id="status-dot"></div>
        <div class="status-info"><span class="status-label">الخادم يعمل</span><span class="status-sub">متصل</span></div>
      </div>
    </div>
  </aside>

  <main class="main-content" style="display:flex;flex-direction:column">
    <header class="topbar">
      <div class="topbar-left" style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-ghost" onclick="toggleSidebar()" style="padding:8px;font-size:20px">☰</button>
        <h1 class="page-title">📝 الملاحظات</h1>
      </div>
    </header>

    <div class="notes-layout">

      <!-- Tree -->
      <div class="notes-tree">
        <div class="tree-hd">
          <span>المجلدات</span>
          <button class="btn btn-primary btn-sm" onclick="newFolder(null)">+ مجلد</button>
        </div>
        <div class="tree-scroll" id="tree"></div>
      </div>

      <!-- Editor -->
      <div class="notes-main">
        <!-- Empty state -->
        <div class="empty-st" id="empty">
          <div style="font-size:48px">📝</div>
          <div style="font-size:16px;font-weight:600">اختر ملاحظة أو أنشئ واحدة</div>
          <div style="font-size:13px">اختر مجلداً واضغط 📝+ لإضافة ملاحظة</div>
        </div>

        <!-- Editor panel -->
        <div id="panel" style="display:none;flex-direction:column;flex:1;overflow:hidden">
          <div class="ed-hd">
            <input id="ed-title" class="ed-title" placeholder="عنوان الملاحظة..." oninput="scheduleSave()">
            <span id="save-ind">محفوظ ✓</span>
            <button class="btn btn-ghost btn-sm" onclick="moveNote()">📁 نقل</button>
            <button class="btn btn-danger btn-sm" onclick="delCurrent()">🗑</button>
          </div>

          <!-- Fixed toolbar -->
          <div class="fmt-bar">
            <button class="fmt-btn" onclick="x('bold')"><b>B</b></button>
            <button class="fmt-btn" onclick="x('italic')"><i>I</i></button>
            <button class="fmt-btn" onclick="x('underline')"><u>U</u></button>
            <button class="fmt-btn" onclick="x('strikeThrough')">S̶</button>
            <div class="fmt-div"></div>
            <button class="fmt-btn" onclick="blk('h1')">H1</button>
            <button class="fmt-btn" onclick="blk('h2')">H2</button>
            <button class="fmt-btn" onclick="blk('h3')">H3</button>
            <div class="fmt-div"></div>
            <button class="fmt-btn" onclick="x('insertUnorderedList')">• قائمة</button>
            <button class="fmt-btn" onclick="x('insertOrderedList')">1. مرقمة</button>
            <button class="fmt-btn" onclick="blk('blockquote')">❝ اقتباس</button>
            <div class="fmt-div"></div>
            <button class="fmt-btn" onclick="insLink()">🔗 رابط</button>
            <button class="fmt-btn" onclick="document.getElementById('img-in').click()">🖼 صورة</button>
            <button class="fmt-btn" onclick="x('insertHorizontalRule')">─ فاصل</button>
          </div>

          <div class="ed-body">
            <div id="editor" contenteditable="true" placeholder="ابدأ الكتابة هنا..."
              oninput="scheduleSave()"
              onkeydown="edKey(event)"
              onmouseup="onSelChange()"
              onkeyup="onSelChange()"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Floating selection toolbar -->
<div id="sel-toolbar">
  <button class="sel-btn" onclick="x('bold')" title="عريض"><b>B</b></button>
  <button class="sel-btn" onclick="x('italic')" title="مائل"><i>I</i></button>
  <button class="sel-btn" onclick="x('underline')" title="تحته خط"><u>U</u></button>
  <button class="sel-btn" onclick="x('strikeThrough')" title="يتوسطه خط">S̶</button>
  <div class="sel-div"></div>
  <button class="sel-btn" onclick="blk('h1')">H1</button>
  <button class="sel-btn" onclick="blk('h2')">H2</button>
  <div class="sel-div"></div>
  <div class="clr-dot" style="background:#de3618" onclick="clr('#de3618')" title="أحمر"></div>
  <div class="clr-dot" style="background:#00a650" onclick="clr('#00a650')" title="أخضر"></div>
  <div class="clr-dot" style="background:#5C6AC4" onclick="clr('#5C6AC4')" title="بنفسجي"></div>
  <div class="clr-dot" style="background:#f59e0b" onclick="clr('#f59e0b')" title="برتقالي"></div>
  <div class="clr-dot" style="background:#1a1a2e;border-color:rgba(255,255,255,.5)" onclick="clr('')" title="إزالة اللون"></div>
  <div class="sel-div"></div>
  <button class="sel-btn" onclick="insLink()">🔗</button>
</div>

<!-- Move modal -->
<div id="mv-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:var(--bg-surface);border-radius:14px;padding:24px;max-width:380px;width:90%;max-height:75vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h3 style="margin:0">📁 نقل الملاحظة</h3>
      <button class="btn btn-ghost btn-sm" onclick="closeMv()">✕</button>
    </div>
    <div id="mv-list"></div>
  </div>
</div>

<input type="file" id="img-in" accept="image/*" style="display:none" onchange="insertImg(this)">
<div class="toast-container" id="toast-container"></div>

<script>
// ═══ DATA (server-side — shared across everyone using the dashboard) ═══════
let _folders = [];
let _notesIndex = []; // lightweight list: {id, folder_id, title, updated_at} — NOT full content
let _openFolderIds = {}; // client-side "expanded" state only

async function loadTreeData() {
  try {
    const res = await fetch('/api/notes/folders');
    const data = await res.json();
    _folders = (data.folders || []).map(f => ({ id: f.id, name: f.name, parentId: f.parent_id }));
    _notesIndex = data.notes || [];
    _folders.forEach(f => { if (!(f.id in _openFolderIds)) _openFolderIds[f.id] = true; });
    renderTree();
  } catch (e) {
    document.getElementById('tree').innerHTML = `<div style="padding:20px;text-align:center;color:var(--error);font-size:13px">فشل تحميل المجلدات</div>`;
  }
}

// ═══ STATE ══════════════════════════════════════════════════════════════════
let _note = null; // active note id
let _timer = null;

// ═══ TREE ═══════════════════════════════════════════════════════════════════
function renderTree() {
  const el = document.getElementById('tree');
  if (!_folders.length) {
    el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">اضغط "+ مجلد" للبدء</div>`;
    return;
  }

  function row(folder, depth) {
    const kids   = _folders.filter(f => f.parentId === folder.id);
    const notes  = _notesIndex.filter(n => n.folder_id === folder.id);
    const hasKids = kids.length || notes.length;
    const pad = depth * 14;
    const isOpen = !!_openFolderIds[folder.id];

    let html = `
      <div class="tree-row" onclick="toggleF(${folder.id})" style="padding-right:${10+pad}px">
        <span style="width:14px;font-size:10px;color:var(--text-muted)">${hasKids?(isOpen?'▼':'▶'):' '}</span>
        <span style="margin-left:4px">📁</span>
        <span class="label" style="margin-right:4px">${esc(folder.name)}</span>
        <div class="acts">
          <button class="act" onclick="event.stopPropagation();newFolder(${folder.id})" title="مجلد فرعي">📁+</button>
          <button class="act" onclick="event.stopPropagation();newNote(${folder.id})" title="ملاحظة">📝+</button>
          <button class="act" onclick="event.stopPropagation();renF(${folder.id})" title="تعديل">✏️</button>
          <button class="act" onclick="event.stopPropagation();delF(${folder.id})" title="حذف" style="color:#de3618">🗑</button>
        </div>
      </div>`;

    if (isOpen) {
      kids.forEach(k => { html += row(k, depth+1); });
      notes.forEach(n => {
        html += `
          <div class="tree-row ${_note===n.id?'active':''}" onclick="openNote(${n.id})" style="padding-right:${10+(depth+1)*14}px">
            <span style="width:14px"> </span>
            <span style="margin-left:4px">📄</span>
            <span class="label" style="margin-right:4px">${esc(n.title||'بدون عنوان')}</span>
            <div class="acts">
              <button class="act" onclick="event.stopPropagation();delNote(${n.id})" style="color:#de3618">🗑</button>
            </div>
          </div>`;
      });
    }
    return html;
  }

  el.innerHTML = _folders.filter(f=>!f.parentId).map(f=>row(f,0)).join('');
}

// ═══ FOLDER OPS ══════════════════════════════════════════════════════════════
async function newFolder(parentId) {
  const name = prompt('اسم المجلد:');
  if (!name?.trim()) return;
  try {
    await fetch('/api/notes/folders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim(), parentId: parentId || null })
    });
    if (parentId) _openFolderIds[parentId] = true;
    await loadTreeData();
  } catch (e) { toast('فشل الإنشاء', 'error'); }
}

function toggleF(id) {
  _openFolderIds[id] = !_openFolderIds[id];
  renderTree();
}

async function renF(id) {
  const folder = _folders.find(f=>f.id===id);
  if (!folder) return;
  const name = prompt('اسم جديد:', folder.name);
  if (!name?.trim()) return;
  try {
    await fetch(`/api/notes/folders/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim() })
    });
    await loadTreeData();
  } catch (e) { toast('فشل التعديل', 'error'); }
}

async function delF(id) {
  if (!confirm('هيتحذف المجلد وكل محتوياته؟')) return;
  try {
    await fetch(`/api/notes/folders/${id}`, { method: 'DELETE' });
    if (_note && _notesIndex.some(n => n.id === _note && isDescendantOrSelf(n.folder_id, id))) {
      _note = null;
      showEmpty();
    }
    await loadTreeData();
    toast('🗑 تم الحذف');
  } catch (e) { toast('فشل الحذف', 'error'); }
}

function isDescendantOrSelf(folderId, targetId) {
  let f = _folders.find(f => f.id === folderId);
  while (f) {
    if (f.id === targetId) return true;
    f = _folders.find(x => x.id === f.parentId);
  }
  return folderId === targetId;
}

// ═══ NOTE OPS ════════════════════════════════════════════════════════════════
async function newNote(folderId) {
  try {
    const res = await fetch('/api/notes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folderId })
    });
    const data = await res.json();
    _openFolderIds[folderId] = true;
    await loadTreeData();
    if (data.id) openNote(data.id);
  } catch (e) { toast('فشل الإنشاء', 'error'); }
}

async function openNote(id) {
  await doSave();
  try {
    const res = await fetch(`/api/notes/${id}`);
    const data = await res.json();
    if (!data.success) return;
    const n = data.note;
    _note = id;
    document.getElementById('empty').style.display = 'none';
    document.getElementById('panel').style.display  = 'flex';
    document.getElementById('ed-title').value = n.title||'';
    document.getElementById('editor').innerHTML    = n.content||'';
    document.getElementById('save-ind').textContent = 'محفوظ ✓';
    setTimeout(() => {
      document.getElementById('editor').querySelectorAll('.img-wrap').forEach(w => attachWrap(w));
    }, 30);
    renderTree();
    document.getElementById('ed-title').focus();
  } catch (e) { toast('فشل فتح الملاحظة', 'error'); }
}

function showEmpty() {
  document.getElementById('empty').style.display = 'flex';
  document.getElementById('panel').style.display  = 'none';
}

async function delNote(id) {
  if (!confirm('هتحذف الملاحظة؟')) return;
  try {
    await fetch(`/api/notes/${id}`, { method: 'DELETE' });
    if (_note===id) { _note=null; showEmpty(); }
    await loadTreeData();
    toast('🗑 تم الحذف');
  } catch (e) { toast('فشل الحذف', 'error'); }
}

function delCurrent() { if (_note) delNote(_note); }

// ═══ AUTO SAVE ═══════════════════════════════════════════════════════════════
function scheduleSave() {
  document.getElementById('save-ind').textContent = '...';
  clearTimeout(_timer);
  _timer = setTimeout(doSave, 700);
}

async function doSave() {
  if (!_note) return;
  const title   = document.getElementById('ed-title').value;
  const content = document.getElementById('editor').innerHTML;
  try {
    await fetch(`/api/notes/${_note}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content })
    });
    document.getElementById('save-ind').textContent = 'محفوظ ✓';
    // Keep the tree's title in sync without a full reload
    const idx = _notesIndex.find(n => n.id === _note);
    if (idx) idx.title = title;
    renderTree();
  } catch (e) {
    document.getElementById('save-ind').textContent = '⚠️ فشل الحفظ';
  }
}

// ═══ MOVE ════════════════════════════════════════════════════════════════════
function moveNote() {
  if (!_note) return;
  function buildList(pid, depth) {
    return _folders.filter(f=>(f.parentId||null)===(pid||null)).map(f=>
      `<div class="mv-item" style="padding-right:${12+depth*14}px" onclick="doMove(${f.id})">📁 ${esc(f.name)}</div>${buildList(f.id,depth+1)}`
    ).join('');
  }
  document.getElementById('mv-list').innerHTML = buildList(null,0)||'<div style="color:var(--text-muted);padding:10px">لا توجد مجلدات</div>';
  document.getElementById('mv-modal').style.display = 'flex';
}

async function doMove(fid) {
  try {
    await fetch(`/api/notes/${_note}/move`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folderId: fid })
    });
    _openFolderIds[fid] = true;
    closeMv();
    await loadTreeData();
    toast('✅ تم النقل');
  } catch (e) { toast('فشل النقل', 'error'); }
}

function closeMv() { document.getElementById('mv-modal').style.display='none'; }

// ═══ RICH TEXT ═══════════════════════════════════════════════════════════════
function x(cmd,v) { document.getElementById('editor').focus(); document.execCommand(cmd,false,v||null); scheduleSave(); }
function blk(tag) { document.getElementById('editor').focus(); document.execCommand('formatBlock',false,tag); scheduleSave(); }
function clr(c)   { document.getElementById('editor').focus(); document.execCommand('foreColor',false,c||'#000'); scheduleSave(); }

function insLink() {
  const url  = prompt('رابط URL:'); if (!url) return;
  const text = prompt('نص الرابط (اختياري):') || url;
  document.getElementById('editor').focus();
  document.execCommand('insertHTML',false,`<a href="${esc(url)}" target="_blank">${esc(text)}</a>`);
  scheduleSave();
}

function edKey(e) {
  if (e.key==='Tab') { e.preventDefault(); document.execCommand('insertHTML',false,'&nbsp;&nbsp;&nbsp;&nbsp;'); }
}

// ═══ FLOATING SELECTION TOOLBAR ══════════════════════════════════════════════
function onSelChange() {
  setTimeout(() => {
    const sel = window.getSelection();
    const tb  = document.getElementById('sel-toolbar');
    if (!sel || sel.isCollapsed || !sel.toString().trim()) {
      tb.classList.remove('show'); return;
    }
    // Check selection is inside editor
    const ed = document.getElementById('editor');
    if (!ed.contains(sel.anchorNode)) { tb.classList.remove('show'); return; }
    const r = sel.getRangeAt(0).getBoundingClientRect();
    tb.style.top  = (r.top + window.scrollY - 50) + 'px';
    // Center horizontally
    const left = r.left + r.width/2 - 150;
    tb.style.left  = Math.max(8, left) + 'px';
    tb.style.right = 'auto';
    tb.classList.add('show');
  }, 10);
}

document.addEventListener('mousedown', (e) => {
  if (!e.target.closest('#sel-toolbar')) {
    document.getElementById('sel-toolbar').classList.remove('show');
  }
});

// ═══ IMAGE INSERT & CONTROLS ═════════════════════════════════════════════════
function insertImg(input) {
  if (!input.files?.[0]) return;
  const file = input.files[0];
  if (file.size > 4*1024*1024) return toast('الصورة أكبر من 4MB', 'error');
  const reader = new FileReader();
  reader.onload = e => {
    const wrap = document.createElement('div');
    wrap.className = 'img-wrap';
    wrap.style.width = '60%';
    wrap.contentEditable = 'false';
    wrap.innerHTML = `
      <div class="img-ftb">
        <button onclick="setW(this,'25%')">25%</button>
        <button onclick="setW(this,'50%')">50%</button>
        <button onclick="setW(this,'75%')">75%</button>
        <button onclick="setW(this,'100%')">100%</button>
        <span style="color:rgba(255,255,255,.4);font-size:11px;margin:0 4px">|</span>
        <button onclick="setAlign(this,'right')">⬅</button>
        <button onclick="setAlign(this,'center')">⬛</button>
        <button onclick="setAlign(this,'left')">➡</button>
        <span style="color:rgba(255,255,255,.4);font-size:11px;margin:0 4px">|</span>
        <button onclick="this.closest('.img-wrap').remove();scheduleSave()" style="color:#ff6b6b">🗑</button>
      </div>
      <img src="${e.target.result}" draggable="false">
      <div class="resize-handle"></div>`;
    attachWrap(wrap);
    // Insert into editor
    const ed = document.getElementById('editor');
    ed.focus();
    const sel = window.getSelection();
    if (sel.rangeCount) {
      const r = sel.getRangeAt(0);
      r.collapse(false);
      r.insertNode(wrap);
      r.setStartAfter(wrap);
      sel.removeAllRanges();
      sel.addRange(r);
    } else {
      ed.appendChild(wrap);
    }
    input.value='';
    scheduleSave();
  };
  reader.readAsDataURL(file);
}

function attachWrap(wrap) {
  // Click to select
  wrap.addEventListener('mousedown', e => {
    if (e.target.closest('.img-ftb') || e.target.closest('.resize-handle')) return;
    e.preventDefault();
    selectWrap(wrap);
  });

  // Resize handle
  const handle = wrap.querySelector('.resize-handle');
  if (!handle) return;
  let startX, startW;
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    e.stopPropagation();
    startX = e.clientX;
    startW = wrap.offsetWidth;
    const onMove = mv => {
      const diff = startX - mv.clientX; // RTL: drag left = bigger
      const newW = Math.max(80, Math.min(startW + diff, wrap.parentElement?.offsetWidth || 800));
      wrap.style.width = newW + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      scheduleSave();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function selectWrap(wrap) {
  document.querySelectorAll('.img-wrap.selected').forEach(w => w.classList.remove('selected'));
  wrap.classList.add('selected');
}

function setW(btn, w) {
  const wrap = btn.closest('.img-wrap');
  if (wrap) { wrap.style.width = w; scheduleSave(); }
}

function setAlign(btn, align) {
  const wrap = btn.closest('.img-wrap');
  if (!wrap) return;
  if (align==='center') { wrap.style.display='block'; wrap.style.margin='8px auto'; wrap.style.float='none'; }
  else if (align==='right') { wrap.style.float='none'; wrap.style.display='block'; wrap.style.marginRight='0'; wrap.style.marginLeft='auto'; }
  else { wrap.style.float='none'; wrap.style.display='block'; wrap.style.marginRight='auto'; wrap.style.marginLeft='0'; }
  scheduleSave();
}

// Deselect image on click outside
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.img-wrap')) {
    document.querySelectorAll('.img-wrap.selected').forEach(w=>w.classList.remove('selected'));
  }
});

// ═══ HELPERS ══════════════════════════════════════════════════════════════════
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg,type='success') {
  const c=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('main-app').classList.toggle('sidebar-collapsed');
}

document.addEventListener('DOMContentLoaded', loadTreeData);
window.addEventListener('beforeunload', doSave);
</script>
